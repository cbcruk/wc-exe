<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>wc-exe PoC — browser production build</title>
    <!--
      Bare specifiers our vendored browser builds import but a page cannot
      resolve on its own. Must come before any module script.

      - node:fs / node:url — @rolldown/browser's entry still imports these
        statically; they point at browser stubs.
      - napi-wasm — lightningcss-wasm's napi glue. A single-file ESM module with
        no bare imports of its own, so an import-map entry is enough; no
        prebundling needed (unlike rolldown's wasi binding).
    -->
    <script type="importmap">
      {
        "imports": {
          "node:fs": "/shim/node-fs.js",
          "node:url": "/shim/node-url.js",
          "napi-wasm": "/vendor/napi-wasm/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <h1>wc-exe PoC: bundler interception</h1>
    <p>
      Driven headlessly by <code>run.mjs</code>. Nothing to click; the host
      calls <code>window.__pocBuild()</code> once
      <code>window.__POC_READY__</code> is set.
    </p>
    <script type="module" src="/poc/build.js"></script>
  </body>
</html>
